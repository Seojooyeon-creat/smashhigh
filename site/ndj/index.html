<style>
:root{--bg:rgba(12,14,22,.74);--line:rgba(255,255,255,.1);--fg:#f3f1ea;--mute:#a9a79f;--acc:#ff5a36;--acc2:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1017;color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.panel{position:fixed;background:var(--bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#title{top:max(12px,env(safe-area-inset-top));left:12px;display:flex;flex-direction:column;gap:2px;max-width:min(60vw,320px)}
#title b{font-size:18px;letter-spacing:-.02em}#title b i{font-style:normal;color:var(--acc)}
#title small{color:var(--mute)}
#title .hint{margin-top:4px;font-size:12px;color:var(--mute)}
#score{top:max(12px,env(safe-area-inset-top));right:12px;text-align:right;min-width:150px}
#score .pts{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
#score .rank{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:4px}
#score .rank b{font-size:30px;font-weight:900;line-height:1;transition:transform .15s}
#score .rank b.pop{transform:scale(1.4)}
#score .bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:6px}
#score .bar i{display:block;height:100%;width:0;background:var(--acc2);transition:width .1s}
#score small{display:block;color:var(--mute);font-size:11px;margin-top:4px}
#tools{bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;padding:8px;align-items:center;max-width:calc(100vw - 24px)}
#tools .row{display:flex;gap:6px}
#tools button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:6px 0;border-radius:10px;border:1px solid transparent;font-size:11px;color:var(--mute)}
#tools button .ic{font-size:22px;line-height:1.1}
#tools button.on{background:rgba(255,90,54,.18);border-color:var(--acc);color:var(--fg)}
#tools button em{font-style:normal;font-size:9px;opacity:.5}
#tools .sub{display:none;align-items:center;gap:8px;font-size:12px;color:var(--mute);width:100%;padding:0 6px}
#tools .sub.on{display:flex}
#tools input[type=range]{flex:1;accent-color:var(--acc)}
#tools .sub output{min-width:62px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
#side{right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;padding:8px}
#side button{all:unset;cursor:pointer;padding:7px 10px;border-radius:9px;font-size:12px;color:var(--fg);background:rgba(255,255,255,.06);text-align:center}
#side button:active{background:rgba(255,255,255,.16)}
#side button.on{background:rgba(255,209,102,.2);color:var(--acc2)}
#depth{left:12px;bottom:max(12px,env(safe-area-inset-bottom));font-size:12px;color:var(--mute);display:none}
#depth b{color:var(--fg);font-variant-numeric:tabular-nums}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:min(12vw,64px);font-weight:900;letter-spacing:-.04em;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6),0 0 40px var(--acc);opacity:0;pointer-events:none;transition:opacity .15s,transform .25s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0d1017;z-index:9;text-align:center;padding:20px}
#load b{font-size:28px}#load b i{font-style:normal;color:var(--acc)}#load p{color:var(--mute);max-width:420px;margin:0}
#load .sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#share{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
#share.on{display:flex}
#share .box{background:#151924;border:1px solid var(--line);border-radius:16px;padding:14px;max-width:min(92vw,560px);width:100%}
#share img{width:100%;border-radius:10px;display:block}
#share .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#share .btns button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px}
#share .btns button.pri{background:var(--acc);color:#fff;font-weight:700}
@media (max-width:640px){#title{max-width:50vw}#title .hint{display:none}#score{min-width:120px}#score .pts{font-size:21px}#score .rank b{font-size:24px}#tools button{width:46px}#tools button .ic{font-size:19px}#side{bottom:auto;top:max(96px,calc(env(safe-area-inset-top) + 92px))}#depth{bottom:auto;top:max(96px,calc(env(safe-area-inset-top) + 92px))}#toast{bottom:150px}}
</style>

  for (let i = 0; i < NZ; i++) for (let j = 0; j < NX; j++) {

// ---------- cinematic camera ----------

// ---------- undo / rewind ----------
const hist = []; let rewind = null, initial = null;
function snapshot() {

  const s = { n, a, H: Float32Array.from(H), tcol: Float32Array.from(tcol), trees: Uint8Array.from(treeAlive), score, style, destroyed, collapsedN, maxDug, statics: blds.map(B => B.statics), collapsed: blds.map(B => B.collapsed) };

}

  pieces.forEach((p, i) => { from.set([p.x, p.y, p.z, p.q.x, p.q.y, p.q.z, p.q.w], i * 7); if (p.st === 3 && s.a[i * 8 + 7] !== 3 && p.bi < 0) { const fi = debrisFree.indexOf(p.idx); if (fi >= 0) debrisFree.splice(fi, 1); debrisOf[p.idx] = p; } p.st = s.a[i * 8 + 7] === 3 ? 3 : 1; p.vx = p.vy = p.vz = p.wx = p.wy = p.wz = 0; p.hr = null; });

// ---------- night ----------
let night = false, nightMix = 0;

const moon = new THREE.Mesh(new THREE.SphereGeometry(42, 20, 16), new THREE.MeshBasicMaterial({ color: 0xfff6d8, fog: false, transparent: true, opacity: 0 })); moon.position.set(900, 760, -1500); scene.add(moon);

const cA = new THREE.Color(), cB = new THREE.Color();

// ---------- input ----------
let pd = null, pointers = 0, multi = false, laserDrag = null, lastClick = 0;
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();

  const objs = groundOnly ? [ground] : [ground, debris, ...blds.map(B => B.mesh)];
  const hits = ray.intersectObjects(objs, false);

    if (h.object === ground) return { point: h.point, piece: null };
    const p = h.object === debris ? debrisOf[h.instanceId] : blds[h.object.userData.bi].cells[h.instanceId];

}

  if (piece && piece.st !== 0 && tool !== 'laser') { const n = splitPiece(piece, 1); if (n) { addScore(5 * n); addStyle(1); } }
  if (tool === 'bomb') throwBomb(P);
  else if (tool === 'bat') swingBat(P, piece);

canvas.addEventListener('pointerdown', e => {
  ac(); pointers++; if (pointers > 1) { multi = true; if (laserDrag) { laserDrag = null; pathLine.visible = false; controls.enabled = true; } return; }
  multi = false; pd = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (cine) { skipCine(); pd = null; return; }
  if (tool === 'laser' && !rewind) { const h = pick(e.clientX, e.clientY, true); if (h) { laserDrag = { A: h.point.clone(), B: h.point.clone() }; controls.enabled = false; pathLine.visible = true; pathLine.geometry.setFromPoints([laserDrag.A.clone().setY(laserDrag.A.y + 1), laserDrag.B.clone().setY(laserDrag.B.y + 1)]); wake(.3); } }
});
canvas.addEventListener('pointermove', e => {
  if (!laserDrag || multi) return; const h = pick(e.clientX, e.clientY, true); if (!h) return;
  laserDrag.B.copy(h.point); pathLine.geometry.setFromPoints([laserDrag.A.clone().setY(laserDrag.A.y + 1), laserDrag.B.clone().setY(laserDrag.B.y + 1)]); wake(.3);
});
function pointerEnd(e) {

}

canvas.addEventListener('contextmenu', e => e.preventDefault());
function setTool(t) {
  tool = t; document.querySelectorAll('#toolrow button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  $('#batsub').classList.toggle('on', t === 'bat'); $('#quakesub').classList.toggle('on', t === 'quake');
  canvas.style.cursor = t === 'laser' ? 'cell' : 'crosshair';
}
document.querySelectorAll('#toolrow button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#batsize').addEventListener('input', e => { batSize = +e.target.value; $('#batout').textContent = `×${batSize.toFixed(1)} · ${Math.round(36 * batSize)} m`; });
$('#quakemag').addEventListener('input', e => { quakeMag = +e.target.value; $('#quakeout').textContent = `M${quakeMag.toFixed(1)} · 진도 ${MMI(quakeMag)}`; });
$('#undo').addEventListener('click', undo); $('#reset').addEventListener('click', resetAll); $('#night').addEventListener('click', () => setNight(!night));
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const tools = ['bomb', 'bat', 'laser', 'meteor', 'quake', 'nuke']; const n = +e.key;
  if (n >= 1 && n <= 6) setTool(tools[n - 1]);

// ---------- share card ----------
function makeCard() {

  const W = 1200, Hh = 630, c = document.createElement('canvas'); c.width = W; c.height = Hh; const g = c.getContext('2d');
  const sw = canvas.width, sh = canvas.height, sc = Math.max(W / sw, Hh / sh), dw = sw * sc, dh = sh * sc;
  g.drawImage(canvas, (W - dw) / 2, (Hh - dh) / 2, dw, dh);

  g.fillStyle = '#fff'; g.font = '800 54px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif'; g.fillText(CFG.title || 'SMASH', 48, Hh - 150);
  g.font = '500 24px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif'; g.fillStyle = '#c9c6bd'; g.fillText(`${CFG.campusName || ''} · 파괴율 ${Math.round(destroyed / totalCells * 100)}% · 무너진 건물 ${collapsedN}동`, 48, Hh - 106);
  g.fillStyle = '#ffd166'; g.font = '900 72px -apple-system,BlinkMacSystemFont,sans-serif'; g.textAlign = 'right'; g.fillText(score.toLocaleString(), W - 48, Hh - 128);
  const r = rankIdx(); g.fillStyle = RCOL[r]; g.font = '900 40px -apple-system,BlinkMacSystemFont,sans-serif'; g.fillText('RANK ' + RANKS[r], W - 48, Hh - 72);
  g.textAlign = 'left'; g.fillStyle = '#8c8a83'; g.font = '500 20px -apple-system,BlinkMacSystemFont,sans-serif'; g.fillText((CFG.url || '').replace(/^https?:\/\//, ''), 48, Hh - 60);

let cardBlob = null;
$('#shareBtn').addEventListener('click', () => { const c = makeCard(); c.toBlob(b => { cardBlob = b; $('#cardimg').src = URL.createObjectURL(b); $('#share').classList.add('on'); }, 'image/png'); });
$('#shareClose').addEventListener('click', () => $('#share').classList.remove('on'));
$('#shareSave').addEventListener('click', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(cardBlob); a.download = `${CFG.code || 'smash'}-${score}.png`; a.click(); });
$('#shareLink').addEventListener('click', async () => { try { await navigator.clipboard.writeText(CFG.url || location.href); toast('링크를 복사했어요'); } catch { toast('복사 실패'); } });
$('#shareNative').addEventListener('click', async () => {
  const file = new File([cardBlob], 'smash.png', { type: 'image/png' }), data = { files: [file], title: CFG.title, text: `${CFG.title} ${score.toLocaleString()}점 (${RANKS[rankIdx()]} 랭크) ${CFG.url || ''}` };
  if (navigator.canShare && navigator.canShare(data)) { try { await navigator.share(data); } catch { } } else { $('#shareSave').click(); $('#shareLink').click(); }

// ---------- camera / loop ----------
const cx = D.campus.reduce((s, p) => s + p[0], 0) / D.campus.length, cz = D.campus.reduce((s, p) => s + p[1], 0) / D.campus.length;
const span = Math.max(...D.campus.map(p => Math.hypot(p[0] - cx, p[1] - cz))) * 2;
controls.target.set(cx, groundY(cx, cz) + 10, cz); camera.position.set(cx + span * .15, groundY(cx, cz) + span * .5, cz + span * .8); controls.update();
sun.target.position.set(cx, 0, cz);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); const sc = innerHeight * dpr / (2 * Math.tan(camera.fov * Math.PI / 360)); smoke.mat.uniforms.uScale.value = sc; fire.mat.uniforms.uScale.value = sc; wake(.3); }
addEventListener('resize', resize); resize();
if (CFG.hub) $('#hub').style.display = 'inline';
setTool('bomb'); $('#sub').textContent = (CFG.campusName || '') + (CFG.neighbors ? ' · 옆: ' + CFG.neighbors : ''); initial = snapshot(); hist.length = 0;
let last = performance.now() / 1000, lastRender = 0;

  updateCine(dt); updateBombs(dt); updateSwings(dt); updateLaser(dt); updateQuake(dt); updateRewind(dt);
  const moving = rewind ? 0 : stepPhysics(dt);

  for (let i = fxList.length - 1; i >= 0; i--) { const f = fxList[i]; f.t += dt; const u = Math.min(1, f.t / f.dur); f.fn(u, f.obj); if (u >= 1) { scene.remove(f.obj); f.obj.geometry.dispose(); fxList.splice(i, 1); } }

  for (const p of pieces) if (p.hr && p.st === 2) { if (Math.hypot(p.x - p.hr.x, p.z - p.hr.z) > 70) { banner('홈런!'); addScore(300); addStyle(15); } p.hr = null; }

}
const qs = new URLSearchParams(location.search), demo = qs.get('demo');   // 헤드리스 확인용: ?demo=bomb|bat|laser|meteor|quake|nuke&at=ms  (그리기 전에 at 밀리초만큼 미리 돌림)
if (qs.has('clean')) document.querySelectorAll('.panel').forEach(e => e.style.display = 'none');
if (qs.has('lite')) { renderer.shadowMap.enabled = false; renderer.setPixelRatio(1); }
if (demo) {
  setTool(demo); const tb = D.buildings[+(qs.get('b') || 0)], P = new THREE.Vector3(tb.o.reduce((a, q) => a + q[0], 0) / tb.o.length, tb.base + tb.h, tb.o.reduce((a, q) => a + q[1], 0) / tb.o.length);
  if (qs.has('night')) setNight(true);
  if (qs.has('mag')) { $('#quakemag').value = qs.get('mag'); $('#quakemag').dispatchEvent(new Event('input')); } if (qs.has('bat')) { $('#batsize').value = qs.get('bat'); $('#batsize').dispatchEvent(new Event('input')); }
  if (demo === 'laser') fireLaser(P.clone().add(V3.set(-60, 0, 0)), P.clone().add(V3.set(60, 0, 0))); else act({ point: P, piece: null });
  for (let i = 0, n = +(qs.get('at') || 3000) / 16; i < n; i++) tick(timeScale / 60);
  if (qs.has('undo')) { undo(); for (let i = 0; i < 90; i++) tick(1 / 60); }
  window.__state = () => ({ skyDim, bg: scene.background.getHexString(), sunI: sun.intensity, score, destroyed, collapsedN, moving: pieces.filter(p => p.st === 1).length, sleeping: pieces.filter(p => p.st === 2).length, dead: pieces.filter(p => p.st === 3).length, pieces: pieces.length, maxDug, cine: !!cine });
  document.title = JSON.stringify(window.__state());
}
$('#load').remove(); frame();
